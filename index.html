<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="robots" content="noindex,nofollow">
<title>365 天 · 双环时空盘</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --bd:rgba(0,0,0,.10); --bd2:rgba(0,0,0,.22);
    --tx:#1a1a1a; --tx2:#6b6b68; --tx3:#9a9a96; --gold:#BE8F35;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1c1b; --card:#272725; --bd:rgba(255,255,255,.12); --bd2:rgba(255,255,255,.24);
      --tx:#ececea; --tx2:#a8a8a4; --tx3:#7d7d79; --gold:#D8B368;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--bg); color:var(--tx);
    font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}
  .kicker{
    margin:0 0 10px; font-size:12px; letter-spacing:.18em;
    color:var(--gold); font-weight:600;
  }
  h1{margin:0 0 8px; font-size:26px; line-height:1.35; font-weight:600; letter-spacing:.01em}
  .sub{margin:0 0 26px; font-size:14px; line-height:1.7; color:var(--tx2)}
  .list{display:flex; flex-direction:column; gap:12px}
  a.card{
    display:flex; align-items:center; gap:14px;
    padding:18px 18px 17px;
    background:var(--card);
    border:1px solid var(--bd);
    border-radius:14px;
    text-decoration:none; color:inherit;
    transition:border-color .16s ease, transform .16s ease;
  }
  a.card:hover{border-color:var(--bd2)}
  a.card:active{transform:scale(.985)}
  .avatar{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:600; color:var(--gold);
    background:rgba(190,143,53,.12);
    border:1px solid rgba(190,143,53,.32);
  }
  .txt{flex:1 1 auto; min-width:0}
  .n{display:block; font-size:17px; font-weight:600; letter-spacing:.02em}
  .d{display:block; margin-top:4px; font-size:12.5px; color:var(--tx3); letter-spacing:.01em}
  .arrow{flex:0 0 auto; color:var(--tx3); font-size:20px; line-height:1}
  .foot{margin:26px 0 0; font-size:12.5px; line-height:1.9; color:var(--tx3)}
  .foot b{color:var(--tx2); font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">365 天 · 双环时空盘</p>
  <h1>两份，各看各的</h1>
  <p class="sub">点名字进去。一天一张，手机上左右划就是前一天、后一天。</p>

  <div class="list">
    <a class="card" href="qianjun/">
      <span class="avatar">千</span>
      <span class="txt">
        <span class="n">千钧</span>
        <span class="d">2026.09.15 — 2027.09.14</span>
      </span>
      <span class="arrow">›</span>
    </a>
    <a class="card" href="ayi/">
      <span class="avatar">毅</span>
      <span class="txt">
        <span class="n">阿毅</span>
        <span class="d">2026.09.14 — 2027.09.13</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </div>

  <p class="foot">
    <b>怎么看</b>：外环是方位、内环是时辰，一天一张。手机端着转，外环的方位会自己对上你面对的方向，内环的时辰不动。
    转不动的设备（没磁力计、或者微信里打开）就用手指按住外环拖，拖到对得上为止，一样能用。
  </p>
</main>
</body>
</html>
